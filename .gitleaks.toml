# Secret + personal-data scanning for Peekaboo.
# Runs on every commit and push (lefthook) and in CI. Never bypass it — fix the content.
title = "peekaboo"

[extend]
useDefault = true   # all built-in gitleaks rules (API keys, tokens, private keys, …)

[[rules]]
id = "personal-email-address"
description = "Personal e-mail address — keep personal contact data out of the repo"
regex = '''[A-Za-z0-9._%+-]+@(?:gmail|googlemail|naver|daum|hanmail|kakao|icloud|me|mac|outlook|hotmail|live|yahoo|proton|protonmail)\.(?:com|net|me|co\.kr)'''
keywords = ["@gmail", "@googlemail", "@naver", "@daum", "@hanmail", "@kakao", "@icloud", "@me.", "@mac.", "@outlook", "@hotmail", "@live", "@yahoo", "@proton"]

[[rules]]
id = "absolute-home-path"
description = "Absolute home-directory path — leaks local user names and layout; use ~ or repo-relative paths"
regex = '''/Users/[A-Za-z0-9._-]+/'''
keywords = ["/users/"]
[[rules.allowlists]]
regexes = ['''/Users/Shared/''']

[[rules]]
id = "agent-scratch-path"
description = "Temporary agent scratch path — never reference session scratch space from the repo"
regex = '''/(?:private/)?tmp/claude-[0-9]+/'''
keywords = ["/tmp/claude-"]

[[rules]]
id = "credential-file-name"
description = "Credential-looking file committed"
path = '''(?i)(?:^|/)(?:client_secret[^/]*\.json|credentials?[^/]*\.json|service[-_]?account[^/]*\.json|[^/]*\.(?:p12|pfx|pem|key|keystore|jks|mobileprovision|provisionprofile)|\.env(?:\.[^/]*)?|\.netrc|id_(?:rsa|ed25519|ecdsa)(?:\.pub)?)$'''

# Local build outputs are gitignored and full of absolute toolchain paths; never scan them.
[[allowlists]]
description = "Gitignored build outputs"
paths = ['''(?:^|/)\.build/''', '''(?:^|/)build/''', '''(?:^|/)\.swiftpm/''', '''(?:^|/)dist/''']
