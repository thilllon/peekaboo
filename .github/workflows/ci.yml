name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - run: gitleaks git --config .gitleaks.toml --redact --no-banner -v
      - run: gitleaks dir --config .gitleaks.toml --redact --no-banner -v .

  build:
    name: Build & test
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - uses: jdx/mise-action@v5
      - uses: actions/cache@v6
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise/tasks/deps') }}
      - run: mise run deps
      # The app runs on macOS 14 (nothing built for a newer system may be linked in) and records SDK 26.0.
      - name: swift build -c release
        shell: bash
        run: |
          swift build -c release 2>&1 | tee "$RUNNER_TEMP/build.log"
          if grep "built for newer" "$RUNNER_TEMP/build.log"; then exit 1; fi
          vtool -show-build "$(swift build -c release --show-bin-path)/Peekaboo" | tr -s ' \n' ' ' | grep -q "minos 14.0 sdk 26.0"
      - run: swift test
