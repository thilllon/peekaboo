# Tooling for Peekaboo. `mise install` once, then `mise run setup` installs the git hooks.
# Multi-line tasks (app, install) live as files in .mise/tasks/.
[tools]
gitleaks = "8.30.1"
lefthook = "2.2.1"

[tasks.setup]
description = "Install git hooks (secret scanning on every commit and push)"
run = "lefthook install"

[tasks.build]
description = "Debug build"
run = "swift build"

[tasks.test]
description = "Run unit tests"
run = "swift test"

[tasks.secrets]
description = "Scan the whole git history and the working tree for secrets"
run = ["gitleaks git --config .gitleaks.toml --redact --no-banner -v", "gitleaks dir --config .gitleaks.toml --redact --no-banner -v ."]
